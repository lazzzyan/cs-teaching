<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script src="https://cdn.tailwindcss.com"></script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000!important;background-color:#000!important}
#bg{position:fixed;inset:0;z-index:0}

/* 星系按钮区 */
#galaxy-ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#galaxy-ui>*{pointer-events:auto}
.sector{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}
.sector-label{color:rgba(200,215,255,0.6);font-size:13px;letter-spacing:0.12em;font-weight:300;text-shadow:0 0 8px rgba(100,140,240,0.4);transition:all 0.4s}
.sector-btn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:rgba(10,15,35,0.25);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);color:rgba(200,215,255,0.8);font-size:1.5em;cursor:pointer;transition:all 0.45s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(80,130,220,0.1)}
.sector-btn:hover{background:rgba(20,35,70,0.4);border-color:rgba(160,200,255,0.3);box-shadow:0 0 35px rgba(64,48,216,0.5),0 0 60px rgba(0,180,255,0.25);color:#fff;transform:scale(1.08)}
.sector:hover .sector-label{color:rgba(220,235,255,0.9);text-shadow:0 0 15px rgba(120,160,255,0.7)}
.sector.active .sector-btn{border-color:rgba(160,200,255,0.4);box-shadow:0 0 40px rgba(64,48,216,0.6),0 0 80px rgba(0,180,255,0.3)}

/* 内容卡片 */
#content-overlay{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;align-items:center;justify-content:center;padding:10vh 10vw}
#content-overlay.show{display:flex}
#content-card{pointer-events:auto;width:min(76vw,420px);max-height:60vh;overflow-y:auto;background:rgba(10,15,35,0.3);backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 30px;color:#e0e6ff;box-shadow:0 8px 48px rgba(0,0,0,0.6),0 0 60px rgba(80,130,220,0.15);animation:fadeUp 0.45s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
#card-title{font-size:1.4em;font-weight:300;letter-spacing:0.06em;margin-bottom:16px;color:rgba(220,235,255,0.9)}
#card-desc{font-size:0.9em;color:rgba(180,200,230,0.7);line-height:1.7;margin-bottom:24px}
#btn-back{padding:10px 24px;border:1px solid rgba(255,255,255,0.1);border-radius:20px;background:rgba(20,30,60,0.3);backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%);color:rgba(200,215,255,0.8);font-size:0.85em;cursor:pointer;transition:all 0.4s;letter-spacing:0.05em;float:right}
#btn-back:hover{background:rgba(30,45,90,0.5);border-color:rgba(160,200,255,0.3);box-shadow:0 0 25px rgba(64,48,216,0.5);color:#fff}

/* 响应式 */
@media(max-width:768px){.sector-btn{width:44px;height:44px;font-size:1.1em}.sector-label{font-size:10px}#content-card{width:82vw;padding:20px;max-height:55vh}.sector[data-scene]{top:14%!important}.sector[data-scene=comp],.sector[data-scene=knowledge]{bottom:16%!important}}
  #content-card{pointer-events:auto;width:min(76vw,420px);max-height:60vh;overflow-y:auto;background:rgba(10,15,35,0.3);backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:28px 30px;color:#e0e6ff;box-shadow:0 8px 48px rgba(0,0,0,0.6),0 0 60px rgba(80,130,220,0.15);animation:fadeUp 0.45s ease-out}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- 4个浮动按钮 -->
<div id="galaxy-ui">
  <div class="sector" id="sec-biology" data-scene="biology" style="top:18%;left:10%">
    <span class="sector-label">BIOLOGY</span>
    <button class="sector-btn">🧬</button>
  </div>
  <div class="sector" id="sec-web3" data-scene="web3" style="top:18%;right:10%">
    <span class="sector-label">WEB3</span>
    <button class="sector-btn">🌐</button>
  </div>
  <div class="sector" id="sec-comp" data-scene="comp" style="bottom:22%;left:10%">
    <span class="sector-label">COMPUTATION</span>
    <button class="sector-btn">⚙️</button>
  </div>
  <div class="sector" id="sec-knowledge" data-scene="knowledge" style="bottom:22%;right:10%">
    <span class="sector-label">KNOWLEDGE</span>
    <button class="sector-btn">✨</button>
  </div>
</div>

<!-- 内容卡片 -->
<div id="content-overlay">
  <div id="content-card">
    <div id="card-title"></div>
    <div id="card-desc"></div>
    <button id="btn-back">← 返回主页</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";

// ==================== 配置 ====================
const C = {
  ROTATE: 30,          // 自转周期（秒）
  GRAVITY: 2.0,        // 鼠标引力强度
  GLOW: 0.04,          // 辉光
  SIZE_BASE: 200, SIZE_MAX: 20,
  TOTAL_PARTICLES: 0,
};

// ==================== 场景数据 ====================
const SCENES = {
  biology: { title: "BIOLOGY", desc: "生命科学 · 基因编辑 · 生物信息学。探索DNA双螺旋结构中蕴含的无限可能，从分子层面理解生命的奥秘。", icon: "🧬" },
  web3:     { title: "WEB3", desc: "去中心化网络 · 区块链技术 · 分布式系统。构建下一代互联网基础设施，重塑数字世界的信任机制。", icon: "🌐" },
  comp:     { title: "COMPUTATION & ENGINEERING", desc: "计算理论 · 系统工程 · 人工智能。用算法和工程思维解决复杂问题，推动技术边界不断延伸。", icon: "⚙️" },
  knowledge:{ title: "KNOWLEDGE & DATA", desc: "数据科学 · 知识图谱 · 机器学习。从海量数据中提取智慧，让信息转化为可执行的洞见与决策。", icon: "✨" },
};

// ==================== 全局状态 ====================
let scene, camera, renderer;
let galaxyPoints, galaxyUniforms;
let decoGroups = {};
let activeScene = null;
let mouseWorld = new THREE.Vector3(9999, 0, 9999);
let mouseNdc = new THREE.Vector2();
let clock = new THREE.Clock();
let autoAngle = 0;

// Canvas + 渲染器
const canvas = document.getElementById("bg");
renderer = new THREE.WebGLRenderer({ canvas, alpha: true, premultipliedAlpha: false, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);

scene = new THREE.Scene();
scene.background = null;

// 斜俯视相机（非正顶，有纵深感）
camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 200);
camera.position.set(0, 16, 26);
camera.lookAt(0, 0, 0);

// ==================== 纹理 ====================
function glowTex() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.05, "rgba(255,255,255,0.9)");
  g.addColorStop(0.12, "rgba(160,200,255,0.45)");
  g.addColorStop(0.28, "rgba(60,100,220,0.08)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const tex = glowTex();

// ==================== 着色器 ====================
const galaxyVert = `
  attribute vec3 aOrig; attribute float aSz; attribute vec3 aCol;
  uniform vec3 uMouse; uniform float uStr; uniform float uTime; uniform float uPR;
  varying vec3 vCol; varying float vA;
  void main() {
    vec3 p = aOrig;
    p.x += sin(p.z*0.25+uTime*0.35)*0.12;
    p.z += cos(p.x*0.25+uTime*0.35)*0.12;
    vec3 d = uMouse - p; float dist = length(d);
    float gv = uStr/(1.0+dist*dist*0.005);
    p += normalize(d)*gv;
    vec4 mv = modelViewMatrix*vec4(p,1.0);
    float sz = aSz*(${C.SIZE_BASE}.0/-mv.z)*uPR;
    sz *= (1.0+gv*0.6);
    float cd = length(uMouse); float cb = 1.0-smoothstep(0.0,4.0,cd);
    sz *= (1.0+cb*1.5);
    gl_PointSize = clamp(sz,0.3,${C.SIZE_MAX}.0);
    gl_Position = projectionMatrix*mv;
    vCol = aCol*(1.0+cb*1.5+gv*0.3);
    vA = 0.85*(1.0+cb*0.5);
  }`;
const galaxyFrag = `
  varying vec3 vCol; varying float vA;
  void main() {
    float d = length(gl_PointCoord-0.5)*2.0;
    float a = 1.0-smoothstep(0.0,0.5,d); a = pow(a,1.05);
    float gl = exp(-d*8.0)*${C.GLOW};
    gl_FragColor = vec4(vCol*(1.0+gl),vA*a);
  }`;

// ==================== 银河 ====================
function buildGalaxy() {
  const ARMS = 5, PA = 1400, CORE = 800, RINGS = 3, PR = 500, BG = 1800;
  const total = ARMS * PA + CORE + RINGS * PR + BG;
  C.TOTAL_PARTICLES = total;
  const pa = new Float32Array(total * 3), oa = new Float32Array(total * 3);
  const sa = new Float32Array(total), ca = new Float32Array(total * 3);
  let idx = 0;
  const ci = new THREE.Color("#6688ee"), cm = new THREE.Color("#8866dd"), co = new THREE.Color("#5544aa");

  function add(x, y, z, s, c) {
    const i3 = idx * 3;
    pa[i3] = oa[i3] = x; pa[i3 + 1] = oa[i3 + 1] = y; pa[i3 + 2] = oa[i3 + 2] = z;
    sa[idx] = s; ca[i3] = c.r; ca[i3 + 1] = c.g; ca[i3 + 2] = c.b; idx++;
  }
  function gr() { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  for (let arm = 0; arm < ARMS; arm++) {
    const aa = (arm / ARMS) * Math.PI * 2;
    for (let i = 0; i < PA; i++) {
      const t = i / PA, r = 2 + t * 16;
      const sa = aa + t * Math.PI * 2.5 + (Math.random() - 0.5) * 0.45 * (0.3 + t * 0.7);
      const x = Math.cos(sa) * r, z = Math.sin(sa) * r, y = (Math.random() - 0.5) * 0.5 * (1 - t * 0.7);
      const tc = t * 0.7 + Math.random() * 0.3;
      add(x, y, z, 0.35 + Math.random() * 1.0 * (1 - t * 0.5), tc < 0.3 ? ci.clone().lerp(cm, tc / 0.3) : cm.clone().lerp(co, (tc - 0.3) / 0.7));
    }
  }
  for (let i = 0; i < CORE; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.abs(gr() * 2.2);
    add(Math.cos(a) * r, (Math.random() - 0.5) * 0.35, Math.sin(a) * r, 0.2 + Math.random() * 0.7, ci.clone().lerp(new THREE.Color("#aaccff"), Math.random() * 0.6));
  }
  for (let ring = 0; ring < RINGS; ring++) {
    const rr = 6.5 + ring * 4.5, ry = (ring - 1) * 0.25;
    for (let i = 0; i < PR; i++) {
      const a = (i / PR) * Math.PI * 2 + (Math.random() - 0.5) * 0.12, r = rr + (Math.random() - 0.5) * 0.6;
      add(Math.cos(a) * r, ry + (Math.random() - 0.5) * 0.2, Math.sin(a) * r, 0.18 + Math.random() * 0.35, ring === 0 ? ci : ring === 1 ? cm : co);
    }
  }
  for (let i = 0; i < BG; i++) {
    const a = Math.random() * Math.PI * 2, r = 16 + Math.random() * 22;
    add(Math.cos(a) * r + (Math.random() - 0.5) * 28, (Math.random() - 0.5) * 7, Math.sin(a) * r + (Math.random() - 0.5) * 28, 0.08 + Math.random() * 0.15, new THREE.Color(0.08, 0.1, 0.15 + Math.random() * 0.1));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pa, 3));
  geo.setAttribute("aOrig", new THREE.BufferAttribute(oa, 3));
  geo.setAttribute("aSz", new THREE.BufferAttribute(sa, 1));
  geo.setAttribute("aCol", new THREE.BufferAttribute(ca, 3));

  galaxyUniforms = {
    uMouse: { value: new THREE.Vector3(9999, 0, 9999) },
    uStr: { value: 0 }, uTime: { value: 0 },
    uPR: { value: Math.min(window.devicePixelRatio, 2) },
  };

  galaxyPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
    vertexShader: galaxyVert, fragmentShader: galaxyFrag,
    uniforms: galaxyUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(galaxyPoints);
}

// ==================== 中心光晕 ====================
function buildHalo() {
  const r = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.05, 32, 100), new THREE.MeshBasicMaterial({ color: 0x3355aa, transparent: true, opacity: 0.25 }));
  r.rotation.x = Math.PI * 0.5; r.name = "halo"; scene.add(r);
  const n = 200, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, rr = 0.5 + Math.random() * 2; pos[i * 3] = Math.cos(a) * rr; pos[i * 3 + 1] = (Math.random() - 0.5) * 0.15; pos[i * 3 + 2] = Math.sin(a) * rr; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.18, map: tex, color: 0x8899dd, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.6 }));
  p.name = "haloPts"; scene.add(p);
}

// ==================== 4个装饰场景 ====================
function buildDecos() {
  // BIOLOGY — DNA双螺旋
  {
    const g = new THREE.Group(); const n = 800; const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 4, s = i % 2 === 0 ? 1 : -1, r = 1.5;
      pos[i * 3] = Math.cos(t) * r * s; pos[i * 3 + 1] = (t / (Math.PI * 4) - 0.5) * 10; pos[i * 3 + 2] = Math.sin(t) * r * s;
      const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.7, 0.5 + Math.random() * 0.3);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.2, map: tex, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })));
    for (let i = 0; i < 40; i++) {
      const t = (i / 40) * Math.PI * 4, y = (t / (Math.PI * 4) - 0.5) * 10, r = 1.5;
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-Math.cos(t) * r, y, -Math.sin(t) * r), new THREE.Vector3(Math.cos(t) * r, y, Math.sin(t) * r)]), new THREE.LineBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.3 })));
    }
    g.visible = false; g.name = "deco-biology"; scene.add(g); decoGroups.biology = g;
  }
  // WEB3 — 网络节点
  {
    const g = new THREE.Group(); const nodes = [];
    for (let i = 0; i < 150; i++) nodes.push(new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8));
    const pos = new Float32Array(nodes.length * 3);
    nodes.forEach((n, i) => { pos[i * 3] = n.x; pos[i * 3 + 1] = n.y; pos[i * 3 + 2] = n.z; });
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.18, map: tex, color: 0x9977ee, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })));
    for (let i = 0; i < nodes.length; i++)
      for (let j = i + 1; j < nodes.length; j++)
        if (nodes[i].distanceTo(nodes[j]) < 2.5 && Math.random() < 0.06)
          g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([nodes[i], nodes[j]]), new THREE.LineBasicMaterial({ color: 0x6655cc, transparent: true, opacity: 0.18 })));
    g.visible = false; g.name = "deco-web3"; scene.add(g); decoGroups.web3 = g;
  }
  // COMPUTATION — 工程几何
  {
    const g = new THREE.Group();
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(3, 1)), new THREE.LineBasicMaterial({ color: 0x6688cc, transparent: true, opacity: 0.5 })));
    const t = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.TorusGeometry(3.5, 0.06, 16, 64)), new THREE.LineBasicMaterial({ color: 0x8866dd, transparent: true, opacity: 0.4 }));
    t.rotation.x = Math.PI * 0.5; g.add(t);
    const orbN = 500, orbPos = new Float32Array(orbN * 3);
    for (let i = 0; i < orbN; i++) { const a = (i / orbN) * Math.PI * 2, r = 4 + Math.sin(i * 0.5) * 0.5; orbPos[i * 3] = Math.cos(a) * r; orbPos[i * 3 + 1] = (Math.random() - 0.5) * 0.3; orbPos[i * 3 + 2] = Math.sin(a) * r; }
    const orbGeo = new THREE.BufferGeometry(); orbGeo.setAttribute("position", new THREE.BufferAttribute(orbPos, 3));
    g.add(new THREE.Points(orbGeo, new THREE.PointsMaterial({ size: 0.12, map: tex, color: 0x8899ee, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })));
    g.visible = false; g.name = "deco-comp"; scene.add(g); decoGroups.comp = g;
  }
  // KNOWLEDGE — 数据波纹
  {
    const g = new THREE.Group(); const n = 1000; const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random();
      const r = 1.5 + Math.abs(Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * 3.5);
      pos[i * 3] = Math.sin(ph) * Math.cos(th) * r; pos[i * 3 + 1] = Math.sin(ph) * Math.sin(th) * r; pos[i * 3 + 2] = Math.cos(ph) * r;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.16, map: tex, color: 0xccaaff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })));
    g.visible = false; g.name = "deco-knowledge"; scene.add(g); decoGroups.knowledge = g;
  }
}

// ==================== 场景切换（仅装饰淡入淡出） ====================
function switchDeco(name) {
  // 隐藏当前装饰
  if (activeScene && decoGroups[activeScene]) {
    gsap.to(decoGroups[activeScene], { _opacity: 0, duration: 0.6, ease: "power2.out", onUpdate: function() {
      decoGroups[activeScene].children.forEach(c => { if (c.material) c.material.opacity = this._opacity * (c.material.userData?.baseOpacity || 0.3); });
      if (this._opacity < 0.01) decoGroups[activeScene].visible = false;
    }, onComplete: function() { decoGroups[activeScene].visible = false; } });
  }

  // 显示新装饰
  if (name && decoGroups[name]) {
    decoGroups[name].visible = true;
    decoGroups[name].children.forEach(c => { if (c.material) { c.material.opacity = 0; c.material.transparent = true; } });
    gsap.to(decoGroups[name], { _opacity: 1, duration: 0.6, ease: "power2.out", onUpdate: function() {
      decoGroups[name].children.forEach(c => { if (c.material) c.material.opacity = Math.min(this._opacity, c.material.userData?.baseOpacity || 0.3); });
    }});
  }

  activeScene = name;
}

// ==================== 初始化场景 ====================
buildGalaxy();
buildHalo();
buildDecos();

// ==================== 鼠标 ====================
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
window.addEventListener("mousemove", (e) => {
  mouseNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNdc, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(plane, hit)) mouseWorld.copy(hit);
});

// ==================== UI事件 ====================
document.querySelectorAll(".sector").forEach(el => {
  el.addEventListener("click", () => {
    const name = el.dataset.scene;
    switchDeco(name);

    // 高亮当前按钮
    document.querySelectorAll(".sector").forEach(s => s.classList.remove("active"));
    el.classList.add("active");

    // 显示内容卡片
    const overlay = document.getElementById("content-overlay");
    const info = SCENES[name];
    document.getElementById("card-title").textContent = info.icon + " " + info.title;
    document.getElementById("card-desc").textContent = info.desc;
    if (overlay) overlay.classList.add("show");
  });
});

// 返回主页
document.getElementById("btn-back").addEventListener("click", () => {
  switchDeco(null);
  document.querySelectorAll(".sector").forEach(s => s.classList.remove("active"));
  document.getElementById("content-overlay").classList.remove("show");
});

// 响应式
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (galaxyUniforms) galaxyUniforms.uPR.value = Math.min(devicePixelRatio, 2);
});

// ==================== 渲染循环 ====================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.elapsedTime;

  if (galaxyUniforms) {
    galaxyUniforms.uTime.value = time;
    galaxyUniforms.uMouse.value.copy(mouseWorld);
    const cur = galaxyUniforms.uStr.value;
    galaxyUniforms.uStr.value += ((mouseWorld.x < 999 ? C.GRAVITY : 0) - cur) * 0.06;
  }

  // 匀速自转
  autoAngle += (2 * Math.PI / C.ROTATE) * dt;
  const d = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
  camera.position.x = Math.sin(autoAngle) * d;
  camera.position.z = Math.cos(autoAngle) * d;
  camera.lookAt(0, 0, 0);

  // 装饰旋转
  if (decoGroups.biology?.visible) decoGroups.biology.rotation.y += dt * 0.35;
  if (decoGroups.web3?.visible) decoGroups.web3.rotation.y += dt * 0.22;
  if (decoGroups.comp?.visible) decoGroups.comp.children.forEach((c, i) => { c.rotation.y += dt * 0.25 * (i + 1) * 0.5; c.rotation.x += dt * 0.12 * (i % 2 ? -1 : 1); });
  if (decoGroups.knowledge?.visible) decoGroups.knowledge.rotation.y += dt * 0.14;

  const halo = scene.getObjectByName("halo");
  if (halo) halo.rotation.z += dt * 0.025;
  const hp = scene.getObjectByName("haloPts");
  if (hp) hp.rotation.y += dt * 0.04;

  renderer.render(scene, camera);
}

animate();

console.log("%c🚀 Galaxy Ready %c| %c" + C.TOTAL_PARTICLES + " particles %c| %c30s rotation %c| %c4 deco scenes",
  "color:#8af", "", "color:#aaf", "", "color:#8af", "", "color:#aaf");
</script>
